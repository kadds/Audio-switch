name: .NET Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64]

    env:
      Project_Path: src/AudioSwitch.WinUI/AudioSwitch.WinUI.csproj
      Runtime_Identifier: win-x64
      Configuration: ${{ matrix.configuration }}
      Platform: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set build metadata
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          $refName = '${{ github.ref_name }}'
          if ($ref -like 'refs/tags/v*') {
            $version = $refName.Substring(1)
            $channel = 'stable'
          }
          elseif ($ref -eq 'refs/heads/main') {
            $version = '1.0.2'
            $channel = 'main'
          }
          else {
            $version = '1.0.2'
            $channel = 'ci'
          }

          "AudioSwitchVersion=$version" >> $env:GITHUB_ENV
          "AudioSwitchBuildVersion=$version" >> $env:GITHUB_ENV
          "AudioSwitchBuildChannel=$channel" >> $env:GITHUB_ENV
          "AudioSwitchBuildCommit=${{ github.sha }}" >> $env:GITHUB_ENV
          "AudioSwitchBuildTime=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" >> $env:GITHUB_ENV

      - name: Restore helper tools
        shell: pwsh
        run: |
          $toolProjects = @(
            'tools/CapxProbe.csproj',
            'tools/CapxSetProfile.csproj',
            'tools/DtsSetProfile.csproj'
          )
          foreach ($toolProject in $toolProjects) {
            dotnet restore $toolProject `
              --runtime $env:Runtime_Identifier `
              -p:Platform=$env:Platform
          }

      - name: Build helper tools into tools/bin
        shell: pwsh
        run: |
          $toolProjects = @(
            'tools/CapxProbe.csproj',
            'tools/CapxSetProfile.csproj',
            'tools/DtsSetProfile.csproj'
          )
          foreach ($toolProject in $toolProjects) {
            dotnet build $toolProject `
              --configuration $env:Configuration `
              --runtime $env:Runtime_Identifier `
              -p:Platform=$env:Platform `
              --no-restore
          }

      - name: Restore
        shell: pwsh
        run: >-
          dotnet restore $env:Project_Path
          --runtime $env:Runtime_Identifier
          -p:Platform=$env:Platform
          -p:PublishReadyToRun=false

      - name: Build WinUI app
        shell: pwsh
        run: >-
          dotnet build $env:Project_Path
          --configuration $env:Configuration
          --runtime $env:Runtime_Identifier
          -p:Platform=$env:Platform
          -p:PublishReadyToRun=false
          -p:Version=$env:AudioSwitchVersion
          -p:AudioSwitchBuildVersion=$env:AudioSwitchBuildVersion
          -p:AudioSwitchBuildTime=$env:AudioSwitchBuildTime
          -p:AudioSwitchBuildChannel=$env:AudioSwitchBuildChannel
          -p:AudioSwitchBuildCommit=$env:AudioSwitchBuildCommit
          --no-restore

      # The project copies the browser extension into this build directory
      # through the SyncChromeExtensionToAppX target.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioSwitch-${{ matrix.configuration }}-${{ matrix.platform }}
          if-no-files-found: error
          path: src/AudioSwitch.WinUI/bin/${{ matrix.platform }}/${{ matrix.configuration }}/net10.0-windows10.0.26100.0/win-x64/

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $outputPath = 'src/AudioSwitch.WinUI/bin/${{ matrix.platform }}/${{ matrix.configuration }}/net10.0-windows10.0.26100.0/win-x64'
          $archivePath = "AudioSwitch-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          Compress-Archive -Path "$outputPath\*" -DestinationPath $archivePath -CompressionLevel Optimal
          "Release_Archive=$archivePath" >> $env:GITHUB_ENV

      - name: Package signed MSIX installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AudioSwitch_SigningCertificateBase64: ${{ secrets.AUDIO_SWITCH_SIGNING_CERTIFICATE_BASE64 }}
          AudioSwitch_SigningCertificatePassword: ${{ secrets.AUDIO_SWITCH_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($tagVersion -notmatch '^\d+(\.\d+){0,3}$') {
            throw "The release tag must contain a numeric version, for example v1.0.0; got '${{ github.ref_name }}'."
          }

          $versionParts = @($tagVersion.Split('.'))
          while ($versionParts.Count -lt 4) { $versionParts += '0' }
          $packageVersion = ($versionParts[0..3] -join '.')

          if ([string]::IsNullOrWhiteSpace($env:AudioSwitch_SigningCertificateBase64)) {
            throw 'The AUDIO_SWITCH_SIGNING_CERTIFICATE_BASE64 secret is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AudioSwitch_SigningCertificatePassword)) {
            throw 'The AUDIO_SWITCH_SIGNING_CERTIFICATE_PASSWORD secret is not configured.'
          }

          $packageRoot = Join-Path $env:RUNNER_TEMP 'AudioSwitch-msix'
          $certificateRoot = Join-Path $env:RUNNER_TEMP 'AudioSwitch-certificate'
          New-Item -ItemType Directory -Force -Path $packageRoot, $certificateRoot | Out-Null
          $pfxPath = Join-Path $certificateRoot 'AudioSwitch.pfx'
          $cerPath = Join-Path $certificateRoot 'AudioSwitch.cer'
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:AudioSwitch_SigningCertificateBase64))
          $certificatePassword = ConvertTo-SecureString $env:AudioSwitch_SigningCertificatePassword -AsPlainText -Force
          $certificates = @(Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $certificatePassword)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) { throw 'No private-key certificate was found in the configured PFX.' }
          $certificateThumbprint = $certificate.Thumbprint

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'src/AudioSwitch.WinUI/Package.appxmanifest'
          $manifest = New-Object System.Xml.XmlDocument
          $manifest.Load($manifestPath)
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ($null -eq $identity) { throw "Package identity was not found in $manifestPath" }
          $identity.SetAttribute('Version', $packageVersion)
          $identity.SetAttribute('Publisher', $certificate.Subject)
          $manifest.Save($manifestPath)

          Export-Certificate `
            -Cert "Cert:\CurrentUser\My\$certificateThumbprint" `
            -FilePath $cerPath | Out-Null
          Write-Output "::add-mask::$env:AudioSwitch_SigningCertificatePassword"

          try {
            dotnet publish $env:Project_Path `
              --configuration $env:Configuration `
              --runtime $env:Runtime_Identifier `
              -p:Platform=$env:Platform `
              -p:PublishReadyToRun=false `
              -p:GenerateAppxPackageOnBuild=true `
              -p:AppxBundle=Never `
              -p:AppxPackageSigningEnabled=true `
              -p:PackageCertificateKeyFile=$pfxPath `
              -p:PackageCertificatePassword=$env:AudioSwitch_SigningCertificatePassword `
              -p:PackageCertificateThumbprint=$certificateThumbprint `
              -p:Version=$env:AudioSwitchVersion `
              -p:AudioSwitchBuildVersion=$env:AudioSwitchBuildVersion `
              -p:AudioSwitchBuildTime=$env:AudioSwitchBuildTime `
              -p:AudioSwitchBuildChannel=$env:AudioSwitchBuildChannel `
              -p:AudioSwitchBuildCommit=$env:AudioSwitchBuildCommit `
              -p:AppxPackageDir="$packageRoot\" `
              --no-restore

            $msix = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter '*.msix' | Select-Object -First 1
            if ($null -eq $msix) { throw "MSIX package was not produced under $packageRoot" }

            $installerPath = "AudioSwitch-${{ github.ref_name }}-${{ matrix.platform }}.msix"
            $publicCertificatePath = "AudioSwitch-${{ github.ref_name }}-${{ matrix.platform }}.cer"
            Copy-Item -LiteralPath $msix.FullName -Destination $installerPath -Force
            Copy-Item -LiteralPath $cerPath -Destination $publicCertificatePath -Force
            "Release_Installer=$installerPath" >> $env:GITHUB_ENV
            "Release_Certificate=$publicCertificatePath" >> $env:GITHUB_ENV
          }
          finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$certificateThumbprint" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $certificateRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: AudioSwitch-${{ github.ref_name }}-${{ matrix.platform }}-installer
          if-no-files-found: error
          path: |
            AudioSwitch-${{ github.ref_name }}-${{ matrix.platform }}.msix
            AudioSwitch-${{ github.ref_name }}-${{ matrix.platform }}.cer

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "$env:Release_Archive"
          "$env:Release_Installer"
          "$env:Release_Certificate"
          --verify-tag
          --title "AudioSwitch ${{ github.ref_name }}"
          --generate-notes
